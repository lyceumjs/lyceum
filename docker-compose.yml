# Local development database for Lyceum (FR-004). Dev-parity only — not a prod setup.
# The smoke test does NOT use this; it provisions its own ephemeral Postgres via Testcontainers.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lyceum
      POSTGRES_PASSWORD: lyceum
      POSTGRES_DB: lyceum
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lyceum -d lyceum"]
      interval: 5s
      timeout: 5s
      retries: 10
